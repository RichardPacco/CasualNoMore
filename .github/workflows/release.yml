# Build do APK de release no GitHub Actions.
#
# - Ao enviar uma tag "v*" (ex.: v4.0.0): gera o APK assinado com a keystore
#   de release e publica uma GitHub Release com ele anexado. É de lá que o
#   botão "Verificar atualização" do app baixa a versão nova.
# - "Run workflow" (manual, aba Actions): gera o APK e só o deixa como
#   artefato do workflow, sem criar release (para testar o build).
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   CNM_KEYSTORE_BASE64        a keystore (.jks) em base64
#   CNM_UPLOAD_STORE_PASSWORD  senha da keystore
#   CNM_UPLOAD_KEY_ALIAS       alias da chave
#   CNM_UPLOAD_KEY_PASSWORD    senha da chave
# Ver plugins/withReleaseSigning.js e o README.

name: Build APK

on:
  push:
    tags: ["v*"]
    # TEMPORÁRIO: testar o build na branch antes de ir para a main (gera só o
    # artefato, sem release). Remover depois do primeiro build que der certo.
    branches: ["auto-update"]
  workflow_dispatch:

permissions:
  contents: write # criar a release e anexar o APK

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # build completo (4 arquiteturas) sem cache passa de 30 min
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Dependências
        run: npm ci

      - name: Versão do app
        id: version
        run: |
          VERSION=$(grep -oP 'version: "\K[^"]+' app.config.js | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versão no app.config.js: $VERSION"
          # numa tag, a versão do app.config.js tem que bater com a tag
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::A tag $GITHUB_REF_NAME não bate com a versão do app.config.js (v$VERSION)"
            exit 1
          fi

      - name: Keystore de release
        env:
          CNM_KEYSTORE_BASE64: ${{ secrets.CNM_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$CNM_KEYSTORE_BASE64" ]]; then
            echo "::error::Secret CNM_KEYSTORE_BASE64 não configurado: o APK sairia assinado com a chave de debug"
            exit 1
          fi
          echo "$CNM_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CNM_UPLOAD_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Projeto nativo (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Gradle (com cache entre builds)
        uses: gradle/actions/setup-gradle@v4

      - name: Build do APK
        working-directory: android
        env:
          CNM_UPLOAD_STORE_PASSWORD: ${{ secrets.CNM_UPLOAD_STORE_PASSWORD }}
          CNM_UPLOAD_KEY_ALIAS: ${{ secrets.CNM_UPLOAD_KEY_ALIAS }}
          CNM_UPLOAD_KEY_PASSWORD: ${{ secrets.CNM_UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Renomear APK
        run: |
          APK="CasualNoMore-v${{ steps.version.outputs.version }}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Apagar a keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Artefato (build manual ou de teste)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}

      - name: GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK }}
          generate_release_notes: true
